name: CI

on:
  pull_request:
    branches:
      - master
      - develop
  push:
    branches:
      - master
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/clickmoji_ci
      AUTH_SECRET: ci-auth-secret
      AUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-nextauth-secret
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Formatting
        run: npm run format:check

      - name: Dependency audit
        run: npm run audit:all

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E smoke
        run: npm run test:e2e:smoke

      - name: Upload shopping list screenshot evidence
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shopping-list-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: test-results/**/shopping-note-*.png
          if-no-files-found: error
          retention-days: 30

      - name: Upload mobile modal footer evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: modal-footer-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: test-results/**/modal-footer-*.png
          if-no-files-found: error
          retention-days: 30

  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Gate
        run: echo "CI gate passed"
