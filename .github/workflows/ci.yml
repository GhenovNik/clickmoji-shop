name: CI

on:
  pull_request:
    branches:
      - master
      - develop
  push:
    branches:
      - master
      - develop
  workflow_dispatch:
    inputs:
      upload_landing_evidence:
        description: Upload landing review evidence on success
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/clickmoji_ci
      AUTH_SECRET: ci-auth-secret
      AUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-nextauth-secret
      NEXTAUTH_URL: http://localhost:3000
      # Isolated modal-footer fixture database (service below); the harness refuses any other URL.
      MODAL_FOOTER_TEST_DATABASE_URL: postgresql://modal_footer_fixture:modal_footer_fixture@127.0.0.1:55432/clickmoji_modal_footer_test
    services:
      modal-footer-postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: modal_footer_fixture
          POSTGRES_PASSWORD: modal_footer_fixture
          POSTGRES_DB: clickmoji_modal_footer_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U modal_footer_fixture -d clickmoji_modal_footer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Formatting
        run: npm run format:check

      - name: Dependency audit
        run: npm run audit:all

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium webkit

      - name: E2E smoke
        run: npm run test:e2e:smoke

      - name: Mobile modal WebKit regression
        run: npx playwright test tests/e2e/modal-footer.spec.ts --project=modal-webkit --output=test-results/webkit

      - name: Upload mobile modal footer evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: modal-footer-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: test-results/**/modal-footer-*.png
          if-no-files-found: warn
          retention-days: 3

      - name: Upload shopping list screenshot evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shopping-list-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            test-results/**/shopping-note-*.png
            test-results/**/shopping-compact-*.png
          if-no-files-found: warn
          retention-days: 3

      - name: Upload history screenshot evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: history-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: test-results/**/history-375-*.png
          if-no-files-found: warn
          retention-days: 3

      - name: Upload landing screenshot evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: landing-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            test-results/**/landing-*.png
            test-results/**/landing-source-*.webp
            test-results/**/landing-provenance-*.json
          if-no-files-found: warn
          retention-days: 3

      - name: Upload landing screenshot evidence on request
        if: success() && github.event_name == 'workflow_dispatch' && inputs.upload_landing_evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: landing-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            test-results/**/landing-*.png
            test-results/**/landing-source-*.webp
            test-results/**/landing-provenance-*.json
          if-no-files-found: error
          retention-days: 3

  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Gate
        run: echo "CI gate passed"
